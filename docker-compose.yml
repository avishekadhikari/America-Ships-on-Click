# Local PostgreSQL for development:
#   docker compose up -d
#   DATABASE_URL="postgresql://asoc:asoc@localhost:5432/asoc" npm run dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: asoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asoc
      POSTGRES_PASSWORD: asoc
      POSTGRES_DB: asoc
    ports:
      - "5432:5432"
    volumes:
      - asoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asoc -d asoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asoc-pgdata:
